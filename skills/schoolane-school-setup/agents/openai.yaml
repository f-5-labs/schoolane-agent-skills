interface:
  display_name: 'SchooLane School Setup'
  short_description: 'Apply a school template and create teachers and classes'
  default_prompt: 'Use $schoolane-school-setup to apply the Basic 1–9 pack to my blank school and then create staff and classes through SchooLane MCP.'
dependencies:
  tools:
    - type: 'mcp'
      value: 'schoolane'
      description: 'Authenticated SchooLane school operations MCP server'
      transport: 'streamable_http'
      url: 'https://api.schoolane.app/mcp'
